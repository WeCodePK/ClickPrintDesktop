name: Release

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply"
        type: choice
        options: [patch, minor, major]
        default: patch

# Two releases building at once would resolve to the same next version.
concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  contents: write

# How many releases to keep. Older ones are deleted, tag and all, after each
# successful publish. Keeping a handful means a client that is a few versions
# behind can still fetch the old blockmap for a differential download.
env:
  KEEP_RELEASES: 5

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The real version lives in GitHub releases, not in package.json. The
      # version in package.json is only a baseline for the very first release.
      - name: Resolve next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Includes drafts and prereleases on purpose: a tag that already
          # exists must never be handed back out as the next version.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].tag_name' > tags.txt
          VERSION=$(node scripts/next-version.js \
            "${{ inputs.bump || 'patch' }}" \
            "$(node -p "require('./package.json').version")" < tags.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      # Working-tree only. This is never committed, so prod stays exactly
      # where main is and there is nothing to pull back down locally.
      - name: Apply version
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run build:renderer

      - name: Build and publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The updater only ever reads the newest release, so everything older is
      # dead weight that clutters the tag list. Runs after a successful publish
      # and never fails the job: the release is already out by this point, and a
      # failed cleanup is not worth marking it red over.
      - name: Prune superseded releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].tag_name' > tags.txt
          node scripts/prune-releases.js "$KEEP_RELEASES" < tags.txt | while read -r TAG; do
            echo "Deleting release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}"
          done
